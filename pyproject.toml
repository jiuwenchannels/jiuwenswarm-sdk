[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-sdk"
version = "1.0.0"
description = "Python SDK facade for the JiuwenSwarm agent runtime"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Full in-process runtime (Agent.create mode)
runtime = ["openjiuwen>=1.0.0"]
# OpenTelemetry tracing (OtelTracer)
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
# Redis checkpoint backend (RedisCheckpointBackend)
redis = ["redis>=5.0"]
# HTTP REST + WebSocket gateway server
gateway = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# All optional extras bundled
all = [
    "openjiuwen>=1.0.0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# Development tools
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
# Namespace package: auto-discover openjiuwen.sdk and openjiuwen.sdk._internal
where = ["."]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "system: end-to-end tests that require a running local server (deselect with -m 'not system')",
]
