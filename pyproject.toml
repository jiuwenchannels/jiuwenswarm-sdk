[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-sdk"
version = "0.1.0"
description = "Python SDK facade for the JiuwenSwarm agent runtime"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Full in-process runtime (Agent.create mode)
runtime = ["openjiuwen>=0.1.0"]
# Development tools
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
# Namespace package: auto-discover openjiuwen.sdk and openjiuwen.sdk._internal
where = ["."]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
